name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: flowcart
          POSTGRES_USER: flowcart
          POSTGRES_PASSWORD: flowcart_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowcart -d flowcart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgres://flowcart:flowcart_ci@localhost:5432/flowcart?sslmode=disable
      APP_ENV: test
      PAYMENTS_PROVIDER: disabled
      JWT_SECRET: flowcart-ci-only-secret-not-for-production
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
          cache-dependency-path: apps/api/go.sum
      - name: Verify Go formatting
        shell: bash
        run: test -z "$(find . -name '*.go' -print0 | xargs -0 gofmt -l)"
      - name: Apply database migrations
        run: go run ./cmd/migrate up
      - name: Run backend tests
        run: go test ./... -count=1
      - name: Run go vet
        run: go vet ./...
      - name: Build backend
        run: go build ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8081
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate OpenAPI
        working-directory: ${{ github.workspace }}
        run: npx --yes @redocly/cli lint docs/openapi.yaml --config .redocly.yaml
      - name: Run frontend lint
        run: npm run lint
      - name: Run frontend tests
        run: node --test tests/*.test.mjs
      - name: Type-check frontend
        run: npx tsc --noEmit
      - name: Build frontend
        run: npm run build

  browser:
    name: Browser E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: flowcart_e2e
          POSTGRES_USER: flowcart
          POSTGRES_PASSWORD: flowcart_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowcart -d flowcart_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Apply migrations and seed disposable database
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://flowcart:flowcart_ci@localhost:5432/flowcart_e2e?sslmode=disable
          APP_ENV: verification
          FLOWCART_SEED_CONFIRM: FLOWCART_DEMO
        run: |
          go run ./cmd/migrate up
          go run ./cmd/seed
      - name: Start API
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://flowcart:flowcart_ci@localhost:5432/flowcart_e2e?sslmode=disable
          APP_ENV: test
          JWT_SECRET: flowcart-ci-only-secret-not-for-production
          CORS_ALLOWED_ORIGINS: http://127.0.0.1:8787
          PORT: 8081
          PAYMENTS_PROVIDER: disabled
        run: nohup go run ./cmd/server > /tmp/flowcart-api.log 2>&1 &
      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci
      - name: Build frontend
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_MODE: proxy
        run: |
          printf 'API_ORIGIN=http://127.0.0.1:8081\nAPP_ORIGIN=http://127.0.0.1:8787\nNEXT_PUBLIC_API_MODE=proxy\n' > .dev.vars
          npm run build:worker
      - name: Start Worker preview
        working-directory: apps/web
        run: nohup npx opennextjs-cloudflare preview --ip 127.0.0.1 --port 8787 > /tmp/flowcart-web.log 2>&1 &
      - name: Wait for local services
        run: |
          for i in {1..30}; do curl -fsS http://127.0.0.1:8081/health && break || sleep 1; done
          for i in {1..30}; do curl -fsS http://127.0.0.1:8787/ && break || sleep 1; done
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run browser suite
        working-directory: apps/web
        env:
          API_MODE: proxy
          WEB_URL: http://127.0.0.1:8787
          DATABASE_URL: postgres://flowcart:flowcart_ci@localhost:5432/flowcart_e2e?sslmode=disable
        run: npx playwright test
